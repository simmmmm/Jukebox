# Jukebox's Xcode project, made by XcodeGen on the Mac that builds it (CI:
# .github/workflows/ci.yml, through ci/app.sh), so no .xcodeproj is kept
# in git. Every Swift file under Jukebox/ is in the app; JukeboxKit is a
# local Swift package; JukeboxUITests is the screenshot walk.
name: Jukebox
options:
  bundleIdPrefix: com.tijmen
  deploymentTarget:
    # iOS 18 too: "kun je de app ook maken voor ios voor 26" (the
    # photographer, 19 November 2026). What is 26's alone (the tab bar's
    # accessory, its minimising) says `if #available(iOS 26, *)` and gives
    # 18 its own form; the 26 look is unchanged.
    iOS: "18.0"
    # macOS 15 Sequoia too: "ga dan naar macos ook" (the photographer, 19
    # November 2026). The same rule: what is 26's alone (the title bar's
    # head without glass behind it, WideShell.swift's BrandHeadItem; the
    # widget's control) says `if #available(macOS 26, *)` and 15 has its
    # own form.
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.4"
    # ci/app.sh sets the run number for TestFlight (BUILD_NUMBER).
    CURRENT_PROJECT_VERSION: "1"
    # Swift 5 mode with the main actor as the default: UI code reads as it
    # did, and what is not about the UI says `nonisolated` where it must.
    # Concurrency mistakes are then warnings, not errors, in the app; the kit
    # is Swift 6 and strict, and is tested on Linux.
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  JukeboxKit:
    path: JukeboxKit
targets:
  # One target for the iPhone, the iPad and the Mac (a native macOS
  # destination, not Catalyst): one bundle ID, so one App Store record and one
  # purchase.
  Jukebox:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      # The Swift files, and as resources the asset catalog and
      # Resources/PrivacyInfo.xcprivacy: XcodeGen gives a file of a type it
      # has no rule for the Copy Bundle Resources phase (2.40.1 and later).
      - path: Jukebox
    # Swift links the system frameworks it imports itself.
    dependencies:
      - package: JukeboxKit
      # The widget, in PlugIns/ (Contents/PlugIns/ on the Mac): the
      # iPhone's, the iPad's and the Mac's.
      - target: JukeboxWidget
    # One Info.plist for both: the Mac ignores the UI* keys.
    info:
      path: Jukebox/Info.plist
      properties:
        CFBundleDisplayName: Jukebox
        CFBundleName: Jukebox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes: [audio]
        # More than one scene: the phone's window and the car's screen at
        # once. Apple's key: "If you set the value to false, UIKit never
        # creates more than one scene for your app."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          # CarPlay's scene (CarPlay/CarPlayScene.swift). The phone's window
          # is not listed: SwiftUI's App gives that role its own scene, as
          # before; only the car's role is named here.
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: CarPlaySceneDelegate
        # The iPad has no CarPlay, and stays one window as before: its own
        # manifest, read in place of the one above on an iPad (a device's
        # key, as UISupportedInterfaceOrientations~ipad below).
        UIApplicationSceneManifest~ipad:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # A home server is often plain http on the local network, or a
        # certificate the phone does not know: Jukebox goes where it is told.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Jukebox plays music from your Jellyfin, Navidrome or other music server on this network, and on the speakers and TVs you choose in Play On.
        # Chromecasts and the Sonos rooms, looked for by Bonjour only while
        # Play On's list is open (Player/CastNetwork.swift, SonosNetwork.swift).
        NSBonjourServices: [_googlecast._tcp, _sonos._tcp]
        # "Play <album> in Jukebox" by voice, in the car above all: SiriKit's
        # media intent, handled in the app (Intents/SiriMedia.swift). The Mac
        # has no media intents and ignores these.
        INIntentsSupported: [INPlayMediaIntent]
        INSupportedMediaCategories: [INMediaCategoryMusic]
        NSSiriUsageDescription: Siri plays the albums, artists, playlists and stations of your library when you ask for them by name.
        # Jukebox's own Last.fm key (AppSettings.appLastFMKey), from the
        # build's environment: ci/app.sh reads it from the runner's file.
        # Empty without one. Never set in this file: the repository is
        # public, and a setting here would beat the environment.
        LastFMAppKey: $(LASTFM_APP_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tijmen.Jukebox
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # The Mac's alone: the Mac App Store asks for the sandbox (the
        # iPhone's is built in), and the hardened runtime is Xcode's default
        # for a Mac app.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Jukebox/Jukebox-macOS.entitlements
        # The iPhone's: CarPlay audio, granted to the App ID on 16 November
        # 2026. ci/app.sh signs the archive ad hoc so the upload carries it,
        # and stops an upload without it (docs/RELEASE.md, CarPlay).
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Jukebox/Jukebox-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Jukebox/Jukebox-iOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES

  # The widget (JukeboxWidget/JukeboxWidget.swift, docs/ARCHITECTURE.md):
  # Your Station and Home's mixes, read from what the app writes into the
  # App Group. One target for the iPhone, the iPad and the Mac, as the app
  # is: one bundle ID, so one App ID and one set of portal steps
  # (docs/RELEASE.md, The widget), the same sources, and the app embeds
  # it on both by the same dependency. A second Mac-only target would copy
  # all of this for no gain; what differs is the Mac's entitlements alone.
  JukeboxWidget:
    type: app-extension
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: JukeboxWidget
      # The app's files the widget needs too, each Foundation or SwiftUI
      # alone: the snapshot it reads, its buttons' intents, the mark.
      - path: Jukebox/App/WidgetSnapshot.swift
      - path: Jukebox/Intents/WidgetIntents.swift
      - path: Jukebox/Components/ArchShapes.swift
      - path: Jukebox/Components/ArtMeasures.swift
      - path: Jukebox/Components/Tokens.swift
    # ArtMeasures.swift's Station.
    dependencies:
      - package: JukeboxKit
    info:
      path: JukeboxWidget/Info.plist
      properties:
        CFBundleDisplayName: Jukebox
        # The store refuses an extension whose version is not its app's.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tijmen.Jukebox.Widget
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        # The App Group it reads from, as the app's entitlements have it.
        CODE_SIGN_ENTITLEMENTS: JukeboxWidget/JukeboxWidget.entitlements
        # The Mac's: a Mac widget loads only sandboxed, and the group is the
        # same iOS-style `group.` one. macOS 15 and later let a Mac app reach
        # such a group's container when the Mac App Store or TestFlight
        # deployed it, or its profile authorises the group (Apple's
        # forums, thread 721701): the store's profile, made by cloud
        # signing once the App IDs carry the group.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": JukeboxWidget/JukeboxWidget-macOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        # WidgetIntents.swift leaves the app's world out of the widget.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION

  # The screenshot walk (JukeboxUITests/ScreenshotTests.swift), run in the
  # simulator by ci/screenshots.sh. Built only by build-for-testing: the
  # scheme's build action has it for testing alone, so the device build
  # (`xcodebuild build`) and the TestFlight archive build the app as before.
  # Swift 5 mode and the project's main-actor default, as the app: the walk
  # marks what it needs @MainActor itself, so it reads the same either way.
  # For the Mac too, as the app's target is: the Mac's own walk
  # (MacScreenshotTests.swift) drives the Mac app's window for the App
  # Store's pictures. Each file is one platform's, whole, by `#if os`.
  JukeboxUITests:
    type: bundle.ui-testing
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: JukeboxUITests
    dependencies:
      - target: Jukebox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tijmen.Jukebox.UITests
        TEST_TARGET_NAME: Jukebox
        # The iPhone and the iPad are both walked.
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        # XcodeGen gives a UI test bundle the iPhone's run paths on every
        # platform; a Mac bundle keeps its frameworks one folder up, as
        # Xcode's own Mac UI test target says.
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": ["$(inherited)", "@executable_path/../Frameworks", "@loader_path/../Frameworks"]

  # The Mac's snapshots (JukeboxSnapshots/Snapshots.swift): the app's own
  # views and stores, drawn offscreen against the fake Jellyfin, for the
  # MacBook's runs, where the Mac's walk does not run. A Mac app of its own
  # and not the app with an argument: its own bundle ID keeps its files and
  # settings out of the real app's container on the photographer's laptop.
  # Not sandboxed and signed by the linker alone: it is run from the
  # command line, never installed. Built only by ci/screenshots.sh.
  JukeboxSnapshots:
    type: application
    platform: macOS
    sources:
      - path: Jukebox
        excludes:
          # Its @main and its windows; the snapshots have their own main.
          - App/JukeboxApp.swift
          - Info.plist
          - "*.entitlements"
      - path: JukeboxSnapshots
    dependencies:
      - package: JukeboxKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tijmen.Jukebox.Snapshots
        PRODUCT_NAME: JukeboxSnapshots
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_PREVIEWS: NO
        CODE_SIGN_STYLE: Automatic
schemes:
  Jukebox:
    build:
      targets:
        Jukebox: all
        JukeboxUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [JukeboxUITests]
      # The walk takes its own pictures; XCTest's automatic ones at every
      # step would only slow it and fill the result bundle.
      captureScreenshotsAutomatically: false
    archive:
      config: Release
  JukeboxSnapshots:
    build:
      targets:
        JukeboxSnapshots: all
    run:
      config: Debug
