# Jukebox's Xcode project, made by XcodeGen on the Mac that builds it (CI:
# .github/workflows/ci.yml, through ci/app.sh), so no .xcodeproj is kept
# in git. Every Swift file under Jukebox/ is in the app; JukeboxKit is a
# local Swift package; JukeboxUITests is the screenshot walk.
name: Jukebox
options:
  bundleIdPrefix: com.tijmen
  deploymentTarget:
    iOS: "26.0"
    # The Mac's year matches the iPhone's, so shared views need no
    # `if #available`.
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    # ci/app.sh sets the run number for TestFlight (BUILD_NUMBER).
    CURRENT_PROJECT_VERSION: "1"
    # Swift 5 mode with the main actor as the default: UI code reads as it
    # did, and what is not about the UI says `nonisolated` where it must.
    # Concurrency mistakes are then warnings, not errors, in the app; the kit
    # is Swift 6 and strict, and is tested on Linux.
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  JukeboxKit:
    path: JukeboxKit
targets:
  # One target for the iPhone, the iPad and the Mac (a native macOS
  # destination, not Catalyst): one bundle ID, so one App Store record and one
  # purchase.
  Jukebox:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      # The Swift files, and as resources the asset catalog and
      # Resources/PrivacyInfo.xcprivacy: XcodeGen gives a file of a type it
      # has no rule for the Copy Bundle Resources phase (2.40.1 and later).
      - path: Jukebox
    # Swift links the system frameworks it imports itself.
    dependencies:
      - package: JukeboxKit
    # One Info.plist for both: the Mac ignores the UI* keys.
    info:
      path: Jukebox/Info.plist
      properties:
        CFBundleDisplayName: Jukebox
        CFBundleName: Jukebox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes: [audio]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # A home server is often plain http on the local network, or a
        # certificate the phone does not know: Jukebox goes where it is told.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Jukebox plays music from your Jellyfin, Navidrome or other music server on this network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tijmen.Jukebox
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # The Mac's alone: the Mac App Store asks for the sandbox (the
        # iPhone's is built in), and the hardened runtime is Xcode's default
        # for a Mac app.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Jukebox/Jukebox-macOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES

  # The screenshot walk (JukeboxUITests/ScreenshotTests.swift), run in the
  # simulator by ci/screenshots.sh. Built only by build-for-testing: the
  # scheme's build action has it for testing alone, so the device build
  # (`xcodebuild build`) and the TestFlight archive build the app as before.
  # Swift 5 mode and the project's main-actor default, as the app: the walk
  # marks what it needs @MainActor itself, so it reads the same either way.
  # For the Mac too, as the app's target is: the Mac's own walk
  # (MacScreenshotTests.swift) drives the Mac app's window for the App
  # Store's pictures. Each file is one platform's, whole, by `#if os`.
  JukeboxUITests:
    type: bundle.ui-testing
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: JukeboxUITests
    dependencies:
      - target: Jukebox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tijmen.Jukebox.UITests
        TEST_TARGET_NAME: Jukebox
        # The iPhone and the iPad are both walked.
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        # XcodeGen gives a UI test bundle the iPhone's run paths on every
        # platform; a Mac bundle keeps its frameworks one folder up, as
        # Xcode's own Mac UI test target says.
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": ["$(inherited)", "@executable_path/../Frameworks", "@loader_path/../Frameworks"]
schemes:
  Jukebox:
    build:
      targets:
        Jukebox: all
        JukeboxUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [JukeboxUITests]
      # The walk takes its own pictures; XCTest's automatic ones at every
      # step would only slow it and fill the result bundle.
      captureScreenshotsAutomatically: false
    archive:
      config: Release
